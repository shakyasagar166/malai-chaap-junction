# Server Configuration
server.port=${PORT:8080}

# Spring Application Name
spring.application.name=malai-chaap-junction-backend

# MySQL Database Configuration
# Automatically creates the database if not present
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/malai_chaap_junction_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:9058605348}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Jackson Date & Time Formatting (Indian Standard Time)
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging
logging.level.com.malaichaap=INFO
logging.level.org.springframework.web=INFO
